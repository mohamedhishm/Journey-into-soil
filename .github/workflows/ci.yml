name: ci
on: [push, pull_request]
jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r api/requirements.txt -r api/requirements-dev.txt -r pipelines/requirements.txt
      - run: cd api && ruff check . ../pipelines && python -m pytest -q
      - run: python -m pytest pipelines/tests -q
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: cd web && npm install && npm run typecheck && npm run build
