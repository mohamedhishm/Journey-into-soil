<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0e0c" />
    <title>The Shifter - Journey into the Soil | Precision Soil Intelligence</title>
    <!-- Synchronous theme & language initializer to prevent flash of wrong theme -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('shifter_theme') || localStorage.getItem('theme');
          var theme = (savedTheme === 'light' || savedTheme === 'dark') ? savedTheme : (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.dataset.theme = theme;
          if (theme === 'dark') {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
          var savedLang = localStorage.getItem('shifter_lang') || localStorage.getItem('lang') || 'en';
          document.documentElement.lang = savedLang;
          document.documentElement.dir = savedLang === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>
    <!-- Google Fonts: Inter, Cairo (Arabic RTL), JetBrains Mono -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;500;600;700;800;900&family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class',
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'Cairo', 'sans-serif'],
              mono: ['"JetBrains Mono"', 'monospace'],
              arabic: ['Cairo', 'sans-serif']
            }
          }
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
